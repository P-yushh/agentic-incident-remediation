apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: demo
  labels:
    app: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: api
          image: example/payment-api:1.0
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
