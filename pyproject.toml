[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-incident-remediation"
version = "0.1.0"
description = "A safety-first agentic workflow for infrastructure incident remediation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Piyush" },
]
dependencies = [
  "fastapi>=0.119,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-redis>=0.5,<1",
  "mcp>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
agentic-remediation-api = "agentic_incident_remediation.api.app:main"
agentic-remediation-demo = "agentic_incident_remediation.demo:main"
agentic-remediation-check = "agentic_incident_remediation.readiness:main"
agentic-remediation-actions = "agentic_incident_remediation.actions.app:main"
agentic-remediation-schema-mcp = "agentic_incident_remediation.schema_tools.server:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_incident_remediation"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: opt-in real Docker and Redis checks; no hosted models or GitHub writes",
]

[tool.coverage.run]
branch = true
source = ["agentic_incident_remediation"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_incident_remediation"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_incident_remediation"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
