name: container-integration

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/container-integration.yml'
      - 'sandbox/**'
      - 'src/**'
      - 'tests/integration/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/container-integration.yml'
      - 'sandbox/**'
      - 'src/**'
      - 'tests/integration/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: container-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never consume private-repository minutes if the repository's visibility changes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AIR_RUN_CONTAINER_TESTS: '1'
      AIR_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
      HF_TOKEN: ''
      GITHUB_TOKEN: ''
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Check out repository without retaining credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python without an Actions cache
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Build Kubernetes validator
        run: >-
          docker build --pull
          --tag agentic-remediation/kubeconform-validator:0.1.0
          sandbox/kubeconform-validator

      - name: Build Terraform validator
        run: >-
          docker build --pull
          --tag agentic-remediation/terraform-validator:0.1.0
          sandbox/terraform-validator

      - name: Verify real containers and cross-process Redis recovery
        id: integration
        run: >-
          python -m pytest tests/integration -m integration -vv
          --junitxml="${RUNNER_TEMP}/container-integration.xml"

      - name: Report synthetic integration failures
        if: ${{ always() && steps.integration.outcome != 'skipped' }}
        run: python tests/integration/report_results.py "${RUNNER_TEMP}/container-integration.xml"

      # Results stay in the job log; no artifact uploads, image publication, or paid services.
