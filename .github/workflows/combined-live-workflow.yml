name: combined-live-workflow

on:
  workflow_dispatch:
    inputs:
      confirm_live_calls:
        description: 'Allow at most four Gemini calls using synthetic incidents; no publication or apply'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: combined-live-workflow
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_live_calls &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AIR_RUN_LIVE_WORKFLOW: '1'
      AIR_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
      HF_TOKEN: ''
      GITHUB_TOKEN: ''
      GEMINI_API_KEY: ''
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Check out main without retained credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python without a cache
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Build Kubernetes validator without model credentials
        run: >-
          docker build --pull
          --tag agentic-remediation/kubeconform-validator:0.1.0
          sandbox/kubeconform-validator

      - name: Build Terraform validator without model credentials
        run: >-
          docker build --pull
          --tag agentic-remediation/terraform-validator:0.1.0
          sandbox/terraform-validator

      - name: Run Gemini planner and generator through real validation and Redis review gate
        id: live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python scripts/combined_live_workflow.py run
          --output-dir "${RUNNER_TEMP}/combined-live-workflow"

      - name: Restore both pending reviews in a fresh credential-free process
        run: >-
          python scripts/combined_live_workflow.py recover
          --output-dir "${RUNNER_TEMP}/combined-live-workflow"

      # No retries, artifact uploads, image publication, billing setup, or PR writes.
