<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1770" viewBox="0 0 1600 1770" role="img" aria-labelledby="title description">
  <title id="title">LangGraph remediation node and decision network</title>
  <desc id="description">The eight actual registered nodes are prepare_planning, planner, generator, validator, reflector, prepare_approval, approval_gate and pull_request_executor. Conditional routes connect validation failures to bounded reflection, approved artifacts to publication and failed or rejected states to END. START and END are virtual graph endpoints. Redis is a checkpointer, not a registered graph node.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .title { font-size:42px; font-weight:650; fill:#203432; letter-spacing:-.8px; }
      .subtitle { font-size:23px; fill:#52635f; }
      .node { fill:#fffefb; stroke:#d4ddd6; stroke-width:1.5; }
      .accent { fill:#e2f0ea; stroke:#a8c9be; stroke-width:1.5; }
      .support { fill:#eeeae1; stroke:#dad8ce; stroke-width:1.5; }
      .endpoint { fill:#203f3a; stroke:#203f3a; stroke-width:1.5; }
      .heading { font-size:25px; font-weight:600; fill:#203432; }
      .body { font-size:20px; fill:#52635f; }
      .code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size:23px; font-weight:600; fill:#203432; }
      .label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size:19px; fill:#096b66; }
      .failure-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size:19px; fill:#8e3c35; }
      .edge { fill:none; stroke:#096b66; stroke-width:2.5; stroke-linejoin:round; marker-end:url(#arrow); }
      .conditional { stroke-dasharray:8 6; }
      .failure { fill:none; stroke:#b6655c; stroke-width:2.2; stroke-dasharray:8 6; stroke-linejoin:round; marker-end:url(#arrow-stop); }
      .rule { stroke:#d9dfd8; stroke-width:1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#096b66"/></marker>
    <marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b6655c"/></marker>
  </defs>
  <rect width="1600" height="1770" fill="#f8f5ef"/>
  <rect x="64" y="52" width="7" height="57" rx="3" fill="#096b66"/>
  <text x="91" y="87" class="title">LangGraph node &amp; decision network</text>
  <text x="92" y="122" class="subtitle">8 registered nodes · exact conditional route names · checkpointed AgentState</text>
  <line x1="64" y1="157" x2="1536" y2="157" class="rule"/>

  <!-- Paths are drawn first so their endpoints meet node boundaries cleanly. -->
  <path d="M800 226V270" class="edge"/>
  <path d="M800 370V420" class="edge"/>
  <path d="M800 520V595" class="edge conditional"/>
  <text x="823" y="565" class="label">generation_ready</text>
  <path d="M800 695V770" class="edge conditional"/>
  <text x="823" y="740" class="label">validation_ready</text>
  <path d="M800 870V965" class="edge conditional"/>
  <text x="823" y="925" class="label">approval_ready</text>
  <path d="M800 1065V1120" class="edge"/>
  <path d="M800 1240V1320" class="edge conditional"/>
  <text x="823" y="1288" class="label">approved</text>
  <path d="M800 1420V1510" class="edge"/>

  <!-- The reflection loop is on the left, with a separate termination path. -->
  <path d="M590 820H400" class="edge conditional"/>
  <text x="495" y="800" text-anchor="middle" class="label">reflection_ready</text>
  <path d="M245 770V645H590" class="edge conditional"/>
  <text x="418" y="625" text-anchor="middle" class="label">generation_ready</text>
  <path d="M245 870V1555H650" class="failure"/>
  <text x="224" y="1190" text-anchor="middle" transform="rotate(-90 224 1190)" class="failure-label">failed · retry limit reached</text>

  <!-- Conditional termination routes share a red bus; no additional node exists here. -->
  <path d="M1010 470H1310V1555H950" class="failure"/>
  <text x="1040" y="450" class="failure-label">failed</text>
  <path d="M1010 645H1310" class="failure" style="marker-end:none"/>
  <text x="1040" y="625" class="failure-label">failed</text>
  <path d="M1010 820H1310" class="failure" style="marker-end:none"/>
  <text x="1040" y="800" class="failure-label">failed</text>
  <path d="M1010 1180H1310" class="failure" style="marker-end:none"/>
  <text x="1040" y="1160" class="failure-label">rejected</text>

  <rect x="725" y="180" width="150" height="46" rx="23" class="endpoint"/>
  <text x="800" y="211" text-anchor="middle" class="heading" style="fill:#fffefb;font-size:21px">START</text>
  <rect x="590" y="270" width="420" height="100" rx="14" class="node"/>
  <text x="800" y="310" text-anchor="middle" class="code">prepare_planning</text>
  <text x="800" y="343" text-anchor="middle" class="body">Normalize incident → planning state</text>
  <rect x="590" y="420" width="420" height="100" rx="14" class="node"/>
  <text x="800" y="460" text-anchor="middle" class="code">planner</text>
  <text x="800" y="493" text-anchor="middle" class="body">Generate a structured remediation plan</text>
  <rect x="590" y="595" width="420" height="100" rx="14" class="node"/>
  <text x="800" y="635" text-anchor="middle" class="code">generator</text>
  <text x="800" y="668" text-anchor="middle" class="body">Produce YAML / HCL with schema tools</text>
  <rect x="590" y="770" width="420" height="100" rx="14" class="accent"/>
  <text x="800" y="810" text-anchor="middle" class="code">validator</text>
  <text x="800" y="843" text-anchor="middle" class="body">Run isolated configuration checks</text>
  <rect x="90" y="770" width="310" height="100" rx="14" class="support"/>
  <text x="245" y="810" text-anchor="middle" class="code">reflector</text>
  <text x="245" y="843" text-anchor="middle" class="body">Feedback + bounded retry</text>
  <rect x="590" y="965" width="420" height="100" rx="14" class="node"/>
  <text x="800" y="1005" text-anchor="middle" class="code">prepare_approval</text>
  <text x="800" y="1038" text-anchor="middle" class="body">Bind approval request to this artifact</text>
  <rect x="590" y="1120" width="420" height="120" rx="14" class="accent"/>
  <text x="800" y="1158" text-anchor="middle" class="code">approval_gate</text>
  <text x="800" y="1190" text-anchor="middle" class="body">interrupt() → wait for human decision</text>
  <text x="800" y="1218" text-anchor="middle" class="body">Resume with Command(resume=…)</text>
  <rect x="590" y="1320" width="420" height="100" rx="14" class="node"/>
  <text x="800" y="1360" text-anchor="middle" class="code">pull_request_executor</text>
  <text x="800" y="1393" text-anchor="middle" class="body">Publish approved artifact as a GitHub PR</text>
  <rect x="650" y="1510" width="300" height="90" rx="26" class="endpoint"/>
  <text x="800" y="1547" text-anchor="middle" class="heading" style="fill:#fffefb">END</text>
  <text x="800" y="1576" text-anchor="middle" class="body" style="fill:#dce9e4">Completed / rejected / failed</text>

  <path d="M85 220H155" class="edge"/>
  <text x="175" y="227" class="body">Unconditional edge</text>
  <path d="M85 265H155" class="edge conditional"/>
  <text x="175" y="272" class="body">Conditional route</text>
  <path d="M85 310H155" class="failure"/>
  <text x="175" y="317" class="body">Stop / reject route</text>
  <text x="90" y="389" class="body">Boxes = registered graph nodes.</text>
  <text x="90" y="421" class="body">START / END = virtual endpoints.</text>
  <text x="90" y="453" class="body">Edge labels = router outcomes.</text>
  <text x="1340" y="1370" class="body" style="font-size:18px">Failure / rejection</text>
  <text x="1340" y="1402" class="body" style="font-size:18px">stops execution</text>
  <text x="1340" y="1434" class="body" style="font-size:18px">without publishing.</text>
  <line x1="64" y1="1640" x2="1536" y2="1640" class="rule"/>
  <text x="800" y="1682" text-anchor="middle" class="heading" style="font-size:22px">Redis persists AgentState and approval checkpoints across node boundaries.</text>
  <text x="800" y="1718" text-anchor="middle" class="body">Schema tools and the checkpointer are supporting services, not additional graph nodes.</text>
</svg>
